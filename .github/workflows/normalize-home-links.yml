name: Normalize Canonical Home Links

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - ".github/workflows/normalize-home-links.yml"

permissions:
  contents: write

concurrency:
  group: normalize-canonical-home-links
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5

      - name: Normalize homepage links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'href="index.html"': 'href="./"',
              "href='index.html'": "href='./'",
              'href="/MMA-Fight-Predictor/index.html"': 'href="/MMA-Fight-Predictor/"',
              "href='/MMA-Fight-Predictor/index.html'": "href='/MMA-Fight-Predictor/'",
              'https://dgarbinski.github.io/MMA-Fight-Predictor/index.html': 'https://dgarbinski.github.io/MMA-Fight-Predictor/',
          }

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f"Normalized {len(changed)} HTML file(s).")
          for path in changed:
              print(f"  - {path}")
          PY

      - name: Commit normalized links
        run: |
          if git diff --quiet; then
            echo "Canonical homepage links are already clean."
            exit 0
          fi
          git config user.name "MMA Fight Predictor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' '**/*.html' 2>/dev/null || true
          git add -u
          git commit -m "Normalize canonical homepage links"
          git push
